[workspace]
members = [
    "crates/empire-core",
    "crates/empire-daemon",
    "crates/empire-game",
    "crates/empire-hunt",
    "crates/empire-license-admin",
    "crates/empire-login",
]
exclude = ["desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures-util = "0.3"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.26", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
