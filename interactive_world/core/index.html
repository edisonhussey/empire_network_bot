<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Cell Prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #d7d8da; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: 330px; padding: 10px 12px; background: rgba(32, 33, 35, .86); color: #e6e6e6; border-radius: 10px; }
  #panel[hidden] { display: none; }
  #panel h1 { margin: 0 0 6px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #bdbdbd; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; }
  #panel button { background: rgba(255, 255, 255, .08); color: #eee; border: 1px solid rgba(255, 255, 255, .16); border-radius: 6px; padding: 3px 9px; font: inherit; cursor: pointer; }
  #panel button.on { background: #e6e6e6; color: #222; }
  #panel input { width: 64px; background: rgba(255, 255, 255, .1); color: #eee; border: 1px solid rgba(255, 255, 255, .16); border-radius: 6px; padding: 3px 6px; font: inherit; }
  #panel .box { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, .14); font-size: 12px; }
  #panel code { font-size: 12px; color: #fff; }
  #panel .dim { color: #9a9a9a; }
  .compass-rose { position: fixed; right: 16px; bottom: 16px; pointer-events: none; }
  .compass-rose[hidden] { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1>Terrain cells · prototype</h1>
  <div class="row"><button data-view="wide">Wide</button><button data-view="cells">Cells</button><button data-view="cliffs">Cliffs</button><button data-view="terraces">Terraces</button><button data-view="scarp">Escarpment</button><button data-view="shrine">Shrine</button><button data-view="shrine_top">Shrine top</button></div>
  <div class="row"><button data-t="outlines">Cell outlines</button><button data-t="highlight">Highlight connectors</button><button data-t="wire">Wireframe</button><button data-t="shadows">Shadows</button><button data-t="compass">Compass</button><button data-t="footprint">Footprint</button></div>
  <div class="row"><span class="dim">shrine faces</span><button data-facing="N">N</button><button data-facing="E">E</button><button data-facing="S">S</button><button data-facing="W">W</button></div>
  <div class="box" data-asset><span class="dim">loading the shrine…</span></div>
  <div class="row"><span class="dim">relief</span><button data-relief="1">×1</button><button data-relief="2">×2</button><button data-relief="4">×4</button></div>
  <div class="row"><span class="dim">seed</span><input data-seed type="number" min="1" step="1"></div>
  <div class="box" data-cell></div>
  <div class="box dim" data-stats></div>
</div>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/jsm/" } }</script>
<script type="module" src="app/terrain_demo.js"></script>
</body>
</html>
